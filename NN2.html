<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>365 วันที่มีเธอ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --night: #070508;
    --deep: #120b13;
    --ink: #fff9ef;
    --muted: rgba(255, 249, 239, 0.72);
    --line: rgba(255, 249, 239, 0.18);
    --gold: #f6c76f;
    --rose: #ff6f95;
    --aqua: #77e7d7;
    --violet: #9c86ff;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    color: var(--ink);
    background:
        linear-gradient(180deg, #070508 0%, #120b13 42%, #070508 100%);
    font-family: "Mali", "Leelawadee UI", Tahoma, sans-serif;
    letter-spacing: 0;
    overflow-x: hidden;
}

body.locked {
    overflow: hidden;
}

body.screen-shake {
    animation: screenShake 480ms cubic-bezier(.36, .07, .19, .97);
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#starCanvas {
    z-index: -4;
}

#heartCanvas {
    z-index: 1;
}

#fxCanvas {
    z-index: 30;
}

.scroll-progress {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 40;
    width: var(--progress, 0%);
    height: 4px;
    background: linear-gradient(90deg, var(--rose), var(--gold), var(--aqua), var(--violet));
    box-shadow: 0 0 22px rgba(246, 199, 111, 0.72);
    pointer-events: none;
}

.aurora-ribbons,
.meteor-layer,
.heart-rain,
.cursor-light,
.memory-flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.aurora-ribbons {
    z-index: -2;
    overflow: hidden;
    mix-blend-mode: screen;
}

.aurora-ribbons span {
    position: absolute;
    left: -18vw;
    width: 138vw;
    height: 18vh;
    border-radius: 50%;
    background: linear-gradient(90deg, transparent, rgba(255, 111, 149, 0.36), rgba(119, 231, 215, 0.28), rgba(156, 134, 255, 0.22), transparent);
    filter: blur(18px);
    opacity: 0.58;
    animation: ribbonMove 9s ease-in-out infinite alternate;
}

.aurora-ribbons span:nth-child(1) {
    top: 14vh;
    transform: rotate(-12deg);
}

.aurora-ribbons span:nth-child(2) {
    top: 46vh;
    transform: rotate(8deg);
    animation-delay: -3s;
}

.aurora-ribbons span:nth-child(3) {
    top: 72vh;
    transform: rotate(-5deg);
    animation-delay: -5s;
}

.meteor-layer {
    z-index: 4;
    overflow: hidden;
}

.meteor {
    position: fixed;
    left: var(--x);
    top: var(--y);
    width: 2px;
    height: var(--len);
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255, 249, 239, 0), var(--color));
    box-shadow: 0 0 16px var(--color);
    transform: rotate(52deg);
    animation: meteorFall var(--duration) linear forwards;
}

.heart-rain {
    z-index: 5;
    overflow: hidden;
}

.falling-heart {
    position: fixed;
    left: var(--x);
    top: -40px;
    color: var(--color);
    font-size: var(--size);
    text-shadow: 0 0 18px currentColor;
    animation: heartFall var(--duration) linear forwards;
}

.cursor-light {
    z-index: 6;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 35%), rgba(255, 249, 239, 0.14), transparent 18rem);
    mix-blend-mode: screen;
}

.click-spark {
    position: fixed;
    left: var(--x);
    top: var(--y);
    z-index: 31;
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    background: var(--color);
    box-shadow: 0 0 18px var(--color);
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: clickSpark 700ms ease-out forwards;
}

.cannon-piece {
    position: fixed;
    left: var(--x);
    bottom: -24px;
    z-index: 31;
    width: 10px;
    height: 18px;
    border-radius: 2px;
    background: var(--color);
    box-shadow: 0 0 14px var(--color);
    pointer-events: none;
    animation: cannonFly var(--duration) cubic-bezier(.16, .84, .28, 1) forwards;
}

.memory-flash {
    z-index: 28;
    opacity: 0;
    background: radial-gradient(circle at center, rgba(255, 249, 239, 0.72), rgba(246, 199, 111, 0.24), transparent 54%);
}

.memory-flash.show {
    animation: memoryFlash 650ms ease-out forwards;
}

.grain {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.13;
    background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 4px);
    mix-blend-mode: screen;
}

.intro-curtain {
    position: fixed;
    inset: 0;
    z-index: 25;
    display: grid;
    place-items: center;
    background: #070508;
    pointer-events: none;
    animation: curtainGone 1800ms cubic-bezier(.4, 0, .2, 1) 5200ms forwards;
}

.intro-curtain::before,
.intro-curtain::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    background:
        linear-gradient(90deg, rgba(7, 5, 8, 1), rgba(45, 16, 31, 0.96)),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 38px);
    animation: openCurtain 5200ms cubic-bezier(.55, 0, .18, 1) 1200ms forwards;
}

.intro-curtain::before {
    left: 0;
}

.intro-curtain::after {
    right: 0;
    transform: scaleX(-1);
}

.intro-mark {
    position: relative;
    z-index: 1;
    text-align: center;
}

.intro-mark strong {
    display: block;
    color: var(--gold);
    font-size: 82px;
    line-height: 0.9;
    text-shadow: 0 0 34px rgba(246, 199, 111, 0.58);
}

.intro-mark span {
    display: block;
    margin-top: 12px;
    color: var(--muted);
    font-size: 24px;
}

.topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 12;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
    min-height: 66px;
    padding: 12px 32px;
    background: linear-gradient(180deg, rgba(7, 5, 8, 0.84), rgba(7, 5, 8, 0));
}

.music-toggle {
    min-width: 94px;
    padding: 9px 14px;
    border: 1px solid rgba(246, 199, 111, 0.42);
    border-radius: 999px;
    color: var(--muted);
    background: rgba(7, 5, 8, 0.64);
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: color 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
}

.music-toggle:hover,
.music-toggle.is-playing {
    color: var(--cream);
    border-color: rgba(246, 199, 111, 0.82);
    box-shadow: 0 0 22px rgba(246, 199, 111, 0.18);
}

.music-toggle:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
}
.brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    color: rgba(255, 249, 239, 0.88);
    font-size: 18px;
    text-decoration: none;
    white-space: nowrap;
}

.brand::before {
    content: "";
    width: 30px;
    height: 1px;
    background: var(--gold);
    box-shadow: 0 0 18px var(--gold);
}

.nav {
    display: flex;
    gap: 10px;
    align-items: center;
}

.nav a,
.nav button,
.tiny-button {
    min-height: 38px;
    padding: 7px 14px;
    border: 1px solid rgba(255, 249, 239, 0.24);
    border-radius: 999px;
    background: rgba(7, 5, 8, 0.42);
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    text-decoration: none;
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: transform 160ms ease, filter 160ms ease;
}

.nav a:hover,
.nav a:focus-visible,
.nav button:hover,
.nav button:focus-visible,
.tiny-button:hover,
.tiny-button:focus-visible,
.primary-button:hover,
.primary-button:focus-visible,
.ghost-button:hover,
.ghost-button:focus-visible {
    transform: translateY(-2px);
    filter: brightness(1.06);
    outline: none;
}

.hero {
    position: relative;
    min-height: 88svh;
    display: grid;
    align-items: start;
    padding: 140px 32px 52px;
    isolation: isolate;
}

.hero-memory-universe {
    position: absolute;
    left: 50%;
    top: 64%;
    z-index: 4;
    width: min(92vw, 1500px);
    height: 430px;
    transform: translate(-50%, -50%);
    perspective: 1100px;
    pointer-events: auto;
    touch-action: pan-y;
    user-select: none;
    cursor: grab;
}
.hero-memory-universe.is-dragging { cursor: grabbing; }
.hero-memory-universe::before,
.hero-memory-universe::after {
    content: "";
    position: absolute;
    border: 1px solid rgba(246, 199, 111, 0.2);
    border-radius: 50%;
    box-shadow: inset 0 0 60px rgba(119, 231, 215, 0.035), 0 0 35px rgba(246, 199, 111, 0.04);
}
.hero-memory-universe::before { inset: 14% 3%; }
.hero-memory-universe::after { inset: 26% 15%; border-color: rgba(119, 231, 215, 0.11); }
.memory-planet {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(210px, 14vw, 300px);
    height: clamp(210px, 14vw, 300px);
    aspect-ratio: 1;
    padding: 0;
    border: 0;
    border-radius: 18px;
    background: transparent;
    cursor: pointer;
    pointer-events: auto;
    opacity: 0;
    contain: layout paint;
    backface-visibility: hidden;
    transform-style: preserve-3d;
    will-change: transform, opacity;
}
.memory-planet.planet-tall {
    width: clamp(210px, 14vw, 300px);
    height: clamp(210px, 14vw, 300px);
}
.planet-card {
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
    overflow: hidden;
    border: 2px solid rgba(255, 249, 239, 0.74);
    border-radius: 18px;
    background: rgba(7, 5, 8, 0.92);
    box-shadow: 0 0 0 6px rgba(246, 199, 111, 0.06), 0 18px 40px rgba(0, 0, 0, 0.5), 0 0 28px rgba(246, 199, 111, 0.2);
    transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
}
.planet-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(125deg, rgba(255,255,255,0.24), transparent 32%, transparent 70%, rgba(246,199,111,0.12));
    pointer-events: none;
}
.planet-card img,
.planet-card video { width: 100%; height: 100%; display: block; object-fit: cover; }
.memory-planet:hover .planet-card,
.memory-planet:focus-visible .planet-card {
    border-color: var(--gold);
    box-shadow: 0 0 0 8px rgba(246, 199, 111, 0.12), 0 22px 48px rgba(0, 0, 0, 0.58), 0 0 42px rgba(246, 199, 111, 0.42);
    transform: scale(1.1);
}
.memory-planet:focus-visible { outline: none; }
.planet-play {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 2;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 249, 239, 0.78);
    border-radius: 50%;
    color: #070508;
    background: rgba(246, 199, 111, 0.94);
    box-shadow: 0 0 26px rgba(246, 199, 111, 0.58);
    transform: translate(-50%, -50%);
    font-size: 14px;
}
.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -3;
    background:
        linear-gradient(90deg, rgba(7, 5, 8, 0.94), rgba(7, 5, 8, 0.38) 52%, rgba(7, 5, 8, 0.86)),
        linear-gradient(180deg, rgba(7, 5, 8, 0.12), rgba(7, 5, 8, 0.42) 64%, #070508),
        url("IMG_5795.jpg") center 44% / cover no-repeat;
}

.hero-inner,
.wrap {
    width: min(1120px, 100%);
    margin: 0 auto;
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    min-height: 34px;
    padding: 5px 13px;
    border: 1px solid rgba(255, 249, 239, 0.28);
    border-radius: 999px;
    background: rgba(7, 5, 8, 0.32);
    color: rgba(255, 249, 239, 0.84);
    font-size: 17px;
    backdrop-filter: blur(10px);
}

h1 {
    max-width: 830px;
    margin: 22px 0 18px;
    font-size: 88px;
    line-height: 0.94;
    font-weight: 700;
    text-shadow: 0 28px 80px rgba(0, 0, 0, 0.74);
}

.hero-copy {
    max-width: 630px;
    margin: 0 0 30px;
    color: var(--muted);
    font-size: 24px;
    line-height: 1.5;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
}

.primary-button,
.ghost-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    padding: 12px 25px;
    border-radius: 999px;
    font: inherit;
    font-size: 20px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: transform 160ms ease, filter 160ms ease;
}

.primary-button {
    border: 0;
    color: #1b1014;
    background: linear-gradient(135deg, #fff9ef, var(--gold) 56%, var(--aqua));
    box-shadow: 0 24px 50px rgba(0, 0, 0, 0.36);
}

.ghost-button {
    border: 1px solid rgba(255, 249, 239, 0.26);
    color: var(--ink);
    background: rgba(255, 249, 239, 0.1);
    backdrop-filter: blur(12px);
}

section {
    position: relative;
    padding: 86px 32px;
}

section.section-fx {
    opacity: 0;
    transform: translateY(34px) scale(0.985);
    filter: blur(5px);
    transition:
        opacity 700ms ease,
        transform 700ms ease,
        filter 700ms ease;
}

section.section-fx.in-view {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
}

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 28px;
    margin-bottom: 30px;
}

.section-head h2 {
    margin: 0;
    max-width: 640px;
    font-size: 46px;
    line-height: 1.08;
}

.section-head p {
    max-width: 440px;
    margin: 0;
    color: var(--muted);
    font-size: 20px;
    line-height: 1.45;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1px;
    border: 1px solid var(--line);
    background: var(--line);
}

.stat {
    position: relative;
    min-height: 158px;
    padding: 24px;
    background:
        linear-gradient(180deg, rgba(255, 249, 239, 0.08), rgba(255, 249, 239, 0.02)),
        rgba(7, 5, 8, 0.72);
    overflow: hidden;
}

.stat::after {
    content: "";
    position: absolute;
    inset: -80% -30%;
    background: linear-gradient(105deg, transparent 34%, rgba(255, 249, 239, 0.18), transparent 66%);
    transform: translateX(-70%) rotate(12deg);
    animation: cardShimmer 5.8s ease-in-out infinite;
    pointer-events: none;
}

.stat strong {
    display: block;
    color: var(--gold);
    font-size: 48px;
    line-height: 1;
}

.stat span {
    display: block;
    margin-top: 13px;
    color: var(--muted);
    font-size: 19px;
    line-height: 1.35;
}

.orbit-wrap {
    display: grid;
    grid-template-columns: 0.9fr 1.1fr;
    gap: 38px;
    align-items: center;
}

.orbit {
    position: relative;
    aspect-ratio: 1;
    min-height: 420px;
}

.orbit-ring {
    position: absolute;
    inset: 8%;
    border: 1px solid rgba(255, 249, 239, 0.24);
    border-radius: 50%;
    animation: orbitSpin 22s linear infinite;
}

.orbit-ring:nth-child(2) {
    inset: 19%;
    animation-duration: 16s;
    animation-direction: reverse;
}

.orbit-ring:nth-child(3) {
    inset: 31%;
    animation-duration: 12s;
}

.orbit-ring span {
    position: absolute;
    left: 50%;
    top: -6px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 20px var(--gold);
}

.orbit-ring:nth-child(2) span {
    background: var(--rose);
    box-shadow: 0 0 20px var(--rose);
}

.orbit-ring:nth-child(3) span {
    background: var(--aqua);
    box-shadow: 0 0 20px var(--aqua);
}

.orbit-core {
    position: absolute;
    inset: 50%;
    width: 220px;
    height: 220px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 249, 239, 0.24);
    border-radius: 50%;
    background:
        linear-gradient(135deg, rgba(246, 199, 111, 0.2), rgba(255, 111, 149, 0.12)),
        rgba(7, 5, 8, 0.78);
    transform: translate(-50%, -50%);
    text-align: center;
}

.orbit-core strong {
    display: block;
    color: var(--gold);
    font-size: 68px;
    line-height: 0.9;
}

.orbit-core span {
    display: block;
    margin-top: 8px;
    color: var(--muted);
    font-size: 19px;
}

.orbit-copy {
    color: var(--muted);
    font-size: 24px;
    line-height: 1.55;
}

.film {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
}

.photo-frame {
    position: relative;
    min-height: 0;
    height: clamp(220px, 20vw, 260px);
    padding: 0;
    border: 1px solid rgba(255, 249, 239, 0.16);
    border-radius: 8px;
    overflow: hidden;
    background: #100b12;
    color: var(--ink);
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 180ms ease, box-shadow 180ms ease;
}

.photo-frame::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
        linear-gradient(110deg, transparent 32%, rgba(255, 249, 239, 0.2), transparent 56%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px 7px);
    transform: translateX(-120%);
    animation: photoScan 4.8s ease-in-out infinite;
    pointer-events: none;
}

.photo-frame:hover,
.photo-frame:focus-visible {
    box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.42),
        0 0 38px rgba(246, 199, 111, 0.18);
}

.photo-frame:first-child {
    grid-row: auto;
    min-height: 0;
}

.photo-frame img,
.photo-frame video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 700ms ease, filter 700ms ease;
}

.photo-frame:hover img,
.photo-frame:focus-visible img,
.photo-frame:hover video,
.photo-frame:focus-visible video {
    transform: scale(1.05);
    filter: contrast(1.06) saturate(1.08);
}

.photo-frame:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
}

.caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 54px 18px 17px;
    background: linear-gradient(180deg, transparent, rgba(7, 5, 8, 0.86));
    text-align: left;
}

.caption strong {
    display: block;
    font-size: 22px;
    line-height: 1.2;
}

.caption span {
    display: block;
    margin-top: 5px;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.35;
}

.letter-box {
    display: block;
    padding: 34px;
    border: 1px solid rgba(255, 249, 239, 0.18);
    border-radius: 8px;
    background:
        linear-gradient(135deg, rgba(246, 199, 111, 0.13), transparent 36%),
        rgba(7, 5, 8, 0.68);
    backdrop-filter: blur(14px);
}

.letter-box h2 {
    margin: 0;
    font-size: 46px;
    line-height: 1.08;
}

.letter-box p {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 20px;
    line-height: 1.45;
}

.typed {
    min-height: 308px;
    width: min(820px, 100%);
    margin: 0 auto;
    padding: 60px 0;
    color: rgba(255, 249, 239, 0.9);
    font-size: 24px;
    line-height: 1.58;
    text-align: center;
    white-space: pre-line;
}

.caret {
    display: inline-block;
    width: 8px;
    height: 1em;
    margin-left: 3px;
    vertical-align: -2px;
    background: var(--gold);
    animation: blink 900ms steps(2, start) infinite;
}

.scratch-area {
    position: relative;
    min-height: 290px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 249, 239, 0.18);
    border-radius: 8px;
    overflow: hidden;
    background:
        linear-gradient(120deg, rgba(255, 111, 149, 0.16), rgba(119, 231, 215, 0.1)),
        rgba(7, 5, 8, 0.72);
}

.scratch-area::before {
    content: "";
    position: absolute;
    inset: -24%;
    z-index: 1;
    background:
        radial-gradient(circle at 20% 30%, rgba(255, 111, 149, 0.18), transparent 28%),
        radial-gradient(circle at 76% 60%, rgba(119, 231, 215, 0.16), transparent 32%),
        conic-gradient(from 90deg, transparent, rgba(246, 199, 111, 0.12), transparent, rgba(255, 111, 149, 0.08), transparent);
    filter: blur(12px);
    opacity: 0;
    animation: scratchAura 8s linear infinite;
    transition: opacity 220ms ease;

@keyframes openCurtain {

}

.intro-curtain::after {

@keyframes openCurtainRight {

@keyframes curtainGone {

    }
}

@keyframes orbitSpin {

@keyframes ribbonMove {
    to { transform: translateX(14vw) rotate(10deg) scaleY(1.22); }

@keyframes meteorFall {
    to {
        transform: translate(36vw, 68vh) rotate(52deg);
        opacity: 0;
    }

@keyframes heartFall {
    to {
        transform: translate(var(--drift), calc(100vh + 80px)) rotate(var(--spin));
        opacity: 0;
    }
}

@keyframes memoryFlash {
    0% { opacity: 0; transform: scale(0.88); }
    30% { opacity: 1; }

}

@keyframes clickSpark {
    to {

}

@keyframes cardShimmer {

}

@keyframes photoScan {
    0%, 58% { transform: translateX(-120%); opacity: 0; }
    68% { opacity: 1; }
    100% { transform: translateX(120%); opacity: 0; }
}

@keyframes screenShake {
    10%, 90% { transform: translate3d(-1px, 0, 0); }
    20%, 80% { transform: translate3d(2px, 1px, 0); }
    30%, 50%, 70% { transform: translate3d(-4px, -1px, 0); }
    40%, 60% { transform: translate3d(4px, 1px, 0); }
}

@keyframes scratchAura {
    to { transform: rotate(360deg); }
}

@keyframes scratchSpark {
    to {

@keyframes scratchRipple {
